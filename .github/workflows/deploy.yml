# Minden push után (main ág) felépíti a statikus oldalt, és kiteszi a GitHub Pagesre.
# Beállítás: GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Kitelepítés a GitHub Pagesre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build
        env:
          # Pl. https://advertarise.github.io/Szancsi_lakokocsi és /Szancsi_lakokocsi
          # (saját domain esetén a domain, és üres almappa)
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Settings → Secrets and variables → Actions → Variables → FORMSPREE_ID
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.FORMSPREE_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
